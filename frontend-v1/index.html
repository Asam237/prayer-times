<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Prayer Times</title>
    <link rel="stylesheet" type="text/css" href="styles/popup.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple web app for fetching prayer times based on location."
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
       <style>
      /* Loader styles */
      .loader {
        display: none;
        border: 5px solid #f3f3f3;
        border-top: 5px solid #3498db;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
        margin: 10px auto;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .loader {
        display: none;
        border: 5px solid #f3f3f3;
        border-top: 5px solid #3498db;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
        margin: 10px auto;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .loader-container {
        display: none;
        text-align: center;
        margin-top: 20px;
      }
      input[type="text"] {
        padding: 12px 16px;
        border: 2px solid #ddd;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        transition: border-color 0.3s, box-shadow 0.3s;
      }

      input[type="text"]:focus {
        border-color: #007bff;
        box-shadow: 0 0 8px rgba(0, 123, 255, 0.4);
        outline: none;
      }

      input[type="text"]::placeholder {
        color: #888;
      }

      input[type="text"]::-webkit-outer-spin-button,
      input[type="text"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="text"]:focus {
        border-color: #3498db;
      }
    </style>
    </style>
  </head>
  <body
    class="flex bg-cover bg-center items-center justify-center relative h-screen w-screen"
    style="background-image: url('./images/bg.webp')"
  >

    <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-md z-10">

        Prayer Times
      </h1>

          <option value="Chad">Chad</option>
          <option value="Comoros">Comoros</option>
          <option value="Djibouti">Djibouti</option>
          <option value="Egypt">Egypt</option>
          <option value="Eritrea">Eritrea</option>
          <option value="Ethiopia">Ethiopia</option>
          <option value="Gambia">Gambia</option>
          <option value="Guinea">Guinea</option>
          <option value="Ivory Coast">Ivory Coast</option>
          <option value="Kenya">Kenya</option>
          <option value="Libya">Libya</option>
          <option value="Mali">Mali</option>
          <option value="Mauritania">Mauritania</option>
          <option value="Morocco">Morocco</option>

          <option value="Bangladesh">Bangladesh</option>
          <option value="Bosnia and Herzegovina">Bosnia and Herzegovina</option>
          <option value="Brunei">Brunei</option>
          <option value="Indonesia">Indonesia</option>
          <option value="Iran">Iran</option>
          <option value="Iraq">Iraq</option>
          <option value="Jordan">Jordan</option>
          <option value="Kazakhstan">Kazakhstan</option>

            required

            <option value="" disabled selected>Select your city</option>
            <option value="Other">Other</option>
          </select>
          <input
            type="text"
            id="custom-city"
            placeholder="Enter your city"
            class="px-4 py-2 border rounded-md shadow-sm focus:outline-none focus:ring focus:ring-blue-300 hidden"
          />
        </div>

        <!-- Buttons -->
        <div class="flex gap-4">
          <button
            id="fetch-times"
            class="flex-1 bg-blue-700 text-white font-semibold py-2 rounded-md shadow-lg hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-300"
          >
            Get Times
          </button>
          <button
            id="clear-results"
            class="flex-1 bg-gray-500 text-white font-semibold py-2 rounded-md shadow-lg hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-300"
            onclick="clearResults()"
          >
            Clear
          </button>
        </div>
      </div>

      <div class="loader-container text-center mt-6 hidden">
        <div class="loader"></div>
        <p class="text-sm text-gray-500 mt-2">Fetching prayer times...</p>
      </div>

      <div id="prayer-times" class="mt-6 space-y-3 hidden">
        <div class="prayer-time hidden justify-between bg-gray-400">
          <div class="hidden items-center gap-3">
        <i class="hidden fas fa-moon text-orange-500 text-xl"></i>
            <strong class="hidden text-white font-bold">Iftar:</strong>
          </div>
          <span
            id="iftar-time"
            class="hidden text-white font-bold font-medium text-base animate-fade-in"
          ></span>
        </div>
        <div class="prayer-time flex justify-between">
          <div class="flex items-center gap-3">
            <i class="fas fa-sun text-blue-500 text-xl"></i>
            <strong class="text-gray-700">Fajr:</strong>
          </div>
          <span
            id="fajr-time"
            class="text-gray-900 font-medium text-base"
          ></span>
        </div>
        <div class="prayer-time flex justify-between">
          <div class="flex items-center gap-3">
            <i class="fas fa-sun text-yellow-500 text-xl"></i>
            <strong class="text-gray-700">Dhuhr:</strong>
          </div>
          <span
            id="dhuhr-time"
            class="text-gray-900 font-medium text-base"
          ></span>
        </div>
        <div class="prayer-time flex justify-between">
          <div class="flex items-center gap-3">
            <i class="fas fa-cloud-sun text-orange-500 text-xl"></i>
            <strong class="text-gray-700">Asr:</strong>
          </div>
          <span
            id="asr-time"
            class="text-gray-900 font-medium text-base"
          ></span>
        </div>
        <div class="prayer-time flex justify-between">
          <div class="flex items-center gap-3">
            <i class="fas fa-cloud-sun text-red-500 text-xl"></i>
            <strong class="text-gray-700">Maghrib:</strong>
          </div>
          <span
            id="maghrib-time"
            class="text-gray-900 font-medium text-base"
          ></span>
        </div>
        <div class="prayer-time flex justify-between">
          <div class="flex items-center gap-3">
            <i class="fas fa-moon text-indigo-500 text-xl"></i>
            <strong class="text-gray-700">Isha:</strong>
          </div>
          <span
            id="isha-time"
            class="text-gray-900 font-medium text-base"
          ></span>
        </div>
      </div>
    </div>
    <script src="popup.js"></script>

  function updateCities() {
    const countrySelect = document.getElementById("country");
    const citySelect = document.getElementById("city");
    const customCountryInput = document.getElementById("custom-country");
    const selectedCountry = countrySelect.value;

    // Show custom country input if "Other" is selected
    if (selectedCountry === "Other") {
      customCountryInput.classList.remove("hidden");
      citySelect.innerHTML = '<option value="Other">Other</option>';
      document.getElementById("custom-city").classList.remove("hidden");
    } else {
      customCountryInput.classList.add("hidden");
      document.getElementById("custom-city").classList.add("hidden");

      // Clear existing city options
      citySelect.innerHTML = '<option value="" disabled selected>Select your city</option>';

      // Populate city options based on selected country
      if (countryCities[selectedCountry]) {
        countryCities[selectedCountry].forEach((city) => {
          const option = document.createElement("option");
          option.value = city;
          option.textContent = city;
          citySelect.appendChild(option);
        });
        citySelect.innerHTML += '<option value="Other">Other</option>';
      }
    }

  }
  
  function checkCustomCity() {
    const citySelect = document.getElementById("city");
    const customCityInput = document.getElementById("custom-city");

    // Show custom city input if "Other" is selected
    if (citySelect.value === "Other") {
      customCityInput.classList.remove("hidden");
    } else {
      customCityInput.classList.add("hidden");
    }
  }

  // Function to clear results
  function clearResults() {
    // Reset country and city dropdowns
    document.getElementById("country").value = "";
    document.getElementById("city").innerHTML =
      '<option value="" disabled selected>Select your city</option>';

    // Hide prayer times container
    const prayerTimesContainer = document.getElementById("prayer-times");
    prayerTimesContainer.classList.add("hidden");

    // Clear all prayer time results
    document.getElementById("iftar-time").textContent = "";
    document.getElementById("fajr-time").textContent = "";
    document.getElementById("dhuhr-time").textContent = "";
    document.getElementById("asr-time").textContent = "";
    document.getElementById("maghrib-time").textContent = "";
    document.getElementById("isha-time").textContent = "";
  }
</script>
